interface:
  display_name: "Cutshort"
  short_description: "Connect and edit local Cutshort video projects"
  brand_color: "#7C3AED"
  icon_small: "./assets/cutshort-icon.png"
  icon_large: "./assets/cutshort-icon.png"
  default_prompt: "Use $cutshort to connect to Cutshort and inspect the selected video project."

dependencies:
  tools:
    - type: "mcp"
      value: "cutshort"
      description: "Cutshort local editor MCP server"
      transport: "streamable_http"
      url: "http://localhost:5199/api/external-mcp/mcp"

policy:
  allow_implicit_invocation: true
